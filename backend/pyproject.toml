[project]
name = "backend"
version = "0.1.0"
description = "Full-stack FastAPI template backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.139.0",
    "python-multipart>=0.0.27",
    "email-validator>=2.1.0",
    "tenacity>=8.2.3",
    "pydantic-settings>=2.2.1",
    "emails>=1.1.2",
    "jinja2>=3.1.4",
    "alembic>=1.12.1",
    "httpx>=0.25.1",
    "psycopg[binary]>=3.1.13",
    "sqlmodel>=0.0.39",
    "sentry-sdk[fastapi]>=2.63.0",
    "pyjwt>=2.13.0",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    "pypdf>=6.15.0",
    "pytesseract>=0.3.13",
    "pillow>=12.3.0",
    "docx>=0.2.4",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.3",
    "mypy>=1.8.0",
    "ruff>=0.2.2",
    "coverage>=7.4.3",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
# mypy does not understand pydantic's `@computed_field` stacked on top of
# `@property` (a documented limitation); pydantic requires that order.
disable_error_code = ["prop-decorator"]

[[tool.mypy.overrides]]
module = ["pytesseract"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "unit: marks tests as unit tests (deselect with '-m \"not unit\"')",
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
